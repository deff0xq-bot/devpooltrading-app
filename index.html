#dp-splash{position:absolute;inset:0;z-index:90;contain:strict;overflow:hidden;--sp-e:cubic-bezier(.22,1,.36,1);animation:sp-gone .4s var(--sp-e) 12s forwards}
#dp-splash.is-out{pointer-events:none}
#dp-splash i,#dp-splash svg{position:absolute;display:block}
.sp-bg{inset:0;background:linear-gradient(180deg,var(--sp-a),var(--sp-b) 50%,var(--sp-c))}
.sp-a1,.sp-a2{border-radius:50%}
.sp-a1{left:-34%;top:-16%;width:120%;padding-bottom:120%;background:radial-gradient(closest-side,var(--sp-l1),transparent);animation:sp-drift 8s ease-in-out infinite alternate}
.sp-a2{right:-46%;bottom:-10%;width:130%;padding-bottom:130%;background:radial-gradient(closest-side,var(--sp-l2),transparent);animation:sp-drift 10s ease-in-out -4s infinite alternate-reverse}
.sp-m{left:50%;top:44%;width:240px;height:204px;margin:-102px 0 0 -120px}
.sp-g{left:50%;top:62px;width:340px;height:340px;margin:-170px 0 0 -170px;animation:sp-fade .8s var(--sp-e) both}
.sp-gb{inset:0;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.38),rgba(255,255,255,.1) 46%,transparent);animation:sp-breathe 2.6s ease-in-out .8s infinite alternate}
.sp-k{left:50%;top:0;width:124px;height:124px;margin-left:-62px}
#dp-splash .sp-h{inset:0;width:100%;height:100%;fill:#fff;filter:drop-shadow(0 8px 14px var(--sp-sh));animation:sp-in .72s var(--sp-e) both}
.sp-l{--y:22px}
.sp-r{--y:-22px;animation-delay:.06s}
#dp-splash .sp-w{left:50%;top:148px;width:176px;height:24.4px;margin-left:-88px;fill:#fff;animation:sp-rise .64s var(--sp-e) .2s both}
.sp-b{left:50%;top:200px;width:104px;height:3px;margin-left:-52px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden;animation:sp-fade .5s ease .42s both}
.sp-b i{left:0;top:0;width:38px;height:100%;border-radius:2px;background:#fff;animation:sp-run 1.1s cubic-bezier(.45,0,.55,1) .42s infinite alternate}
@keyframes sp-in{from{opacity:0;transform:translate3d(0,var(--y),0)}}
@keyframes sp-rise{from{opacity:0;transform:translate3d(0,8px,0)}}
@keyframes sp-fade{from{opacity:0}}
@keyframes sp-breathe{to{opacity:.5;transform:scale(1.12)}}
@keyframes sp-run{to{transform:translate3d(66px,0,0)}}
@keyframes sp-drift{to{transform:translate3d(7%,6%,0)}}
@keyframes sp-gone{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#dp-splash .sp-h,#dp-splash .sp-w{animation:sp-fade .3s ease both}.sp-a1,.sp-a2,.sp-gb{animation:none}.sp-b{display:none}}
:root.tg-settling #dp-splash .sp-h,:root.tg-settling #dp-splash .sp-w,:root.tg-settling .sp-g,:root.tg-settling .sp-gb,:root.tg-settling .sp-b,:root.tg-settling .sp-b i{animation-play-state:paused}
:root.sp-on.tg-settling .app{opacity:1;transform:none}
:root.sp-on .app,:root.sp-on #tabbar{transition:none}
